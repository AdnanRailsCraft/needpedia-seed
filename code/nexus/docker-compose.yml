services:
  web:
    image: nginx:alpine
    container_name: nginx-server
    restart: always
    ports:
      - "${NEXUS_HTTP_PORT:-8080}:80"
    volumes:
      - ${NEXUS_DIR:-./Needpedia_Nexus}:/usr/share/nginx/html:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexus-net
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run --token REPLACE_ME --url http://web:80
    networks:
      - nexus-net
    depends_on:
      - web
  order-server:
    image: python:3.11-slim
    container_name: order-server
    restart: always
    command: python /app/order-server.py
    environment:
      - OPENROUTER_API_KEY=REPLACE_ME
    volumes:
      - ./order-server.py:/app/order-server.py:ro
      - ${NEXUS_DIR:-./Needpedia_Nexus}:/data:rw
      - ${HOME:-/home/clearcrow}:/home/clearcrow
    ports:
      - "${NEXUS_ORDER_PORT:-8181}:8181"
    networks:
      - nexus-net
  ttyd:
    image: tsl0922/ttyd
    container_name: ttyd-server
    restart: always
    command: ["ttyd", "-p", "7681", "-W", "/bin/bash"]
    volumes:
      - ${NEXUS_DIR:-./Needpedia_Nexus}:/nexus:rw
      - ${HOME:-/home/clearcrow}:/home/clearcrow:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - nexus-net
networks:
  nexus-net:
    driver: bridge
